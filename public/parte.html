<title>Parte Diario Punilla Full</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2EBD8;
  --surface:#FFF8E7;
  --surface-2:#FBF2DC;
  --ink:#1A1714;
  --ink-2:#4A4237;
  --ink-3:#8A8071;
  --line:#DED2B4;
  --line-soft:#E9DFC6;
  --amarillo:#F0B800;
  --amarillo-tint:#FFF0BE;
  --rojo:#C9241C;
  --rojo-tint:#FBDDD9;
  --verde:#2C6E4B;
  --verde-tint:#DAEBDF;
  --ambar:#9A6207;
  --shadow:0 1px 0 rgba(26,23,20,.05), 0 2px 10px rgba(26,23,20,.06);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130E;
    --surface:#201D15;
    --surface-2:#2A261C;
    --ink:#F2EBD8;
    --ink-2:#C9BFA6;
    --ink-3:#928871;
    --line:#3A3427;
    --line-soft:#302B20;
    --amarillo:#FFD24D;
    --amarillo-tint:#3A3116;
    --rojo:#FF7A6B;
    --rojo-tint:#3B211D;
    --verde:#6FC392;
    --verde-tint:#1D2F24;
    --ambar:#E0A73C;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15130E;
  --surface:#201D15;
  --surface-2:#2A261C;
  --ink:#F2EBD8;
  --ink-2:#C9BFA6;
  --ink-3:#928871;
  --line:#3A3427;
  --line-soft:#302B20;
  --amarillo:#FFD24D;
  --amarillo-tint:#3A3116;
  --rojo:#FF7A6B;
  --rojo-tint:#3B211D;
  --verde:#6FC392;
  --verde-tint:#1D2F24;
  --ambar:#E0A73C;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Archivo","Public Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.02em}
button{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.hd{max-width:760px;margin:0 auto;padding:10px 14px 0;display:flex;align-items:center;gap:10px}
.brandmark{
  width:34px;height:34px;flex:none;border-radius:8px;
  background:var(--amarillo);color:#1A1714;
  display:grid;place-items:center;
  font-family:"Archivo",sans-serif;font-weight:800;font-size:15px;letter-spacing:-.04em;
}
.brandtxt{min-width:0;flex:1}
.brandtxt h1{font-size:16px;font-weight:800;line-height:1.1}
.brandtxt .sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.whoami{
  flex:none;border:1px solid var(--line);background:var(--surface-2);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.whoami:hover{border-color:var(--ink-3)}
.whoami .dot{width:7px;height:7px;border-radius:99px;background:var(--rojo)}
.whoami.set .dot{background:var(--verde)}

.tabs{
  max-width:760px;margin:0 auto;padding:9px 14px 9px;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;border:1px solid var(--line);background:transparent;
  border-radius:8px;padding:7px 11px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:1px;min-width:104px;
}
.tab .t-n{font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;letter-spacing:-.01em;white-space:nowrap}
.tab .t-h{font-size:10.5px;color:var(--ink-3);font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab[aria-selected="true"] .t-h{color:var(--surface-2);opacity:.75}
.tab .t-bar{height:3px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}
.tab .t-bar i{display:block;height:100%;background:var(--verde);width:0;transition:width .25s}
.tab[aria-selected="true"] .t-bar{background:rgba(255,255,255,.22)}

/* ---------- list head ---------- */
.lhead{padding:20px 0 12px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lhead .who{flex:1;min-width:200px}
.lhead h2{font-size:26px;font-weight:800;line-height:1.05}
.lhead .meta{font-size:13px;color:var(--ink-2);margin-top:3px}
.lhead .meta b{color:var(--ink);font-weight:600}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;
}
.pill.m{background:var(--amarillo-tint);color:var(--ambar)}
.pill.t{background:var(--rojo-tint);color:var(--rojo)}
.pill.x{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

.prog{width:100%;display:flex;align-items:center;gap:10px;margin-top:4px}
.prog .track{flex:1;height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden;border:1px solid var(--line)}
.prog .track i{display:block;height:100%;background:var(--verde);width:0;transition:width .3s}
.prog .n{font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* ---------- tasks ---------- */
.blockname{
  font-family:"Archivo",sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
  margin:22px 0 8px;display:flex;align-items:center;gap:10px;
}
.blockname::after{content:"";flex:1;height:1px;background:var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.task{
  display:flex;gap:12px;padding:12px 13px;
  border-bottom:1px solid var(--line-soft);
  cursor:pointer;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.task:last-child{border-bottom:0}
.task.crit{background:linear-gradient(90deg,var(--rojo-tint) 0 3px,transparent 3px)}
.task:hover{background:var(--surface-2)}
.task.crit:hover{background:linear-gradient(90deg,var(--rojo) 0 3px,var(--surface-2) 3px)}
.box{
  flex:none;width:26px;height:26px;margin-top:1px;border-radius:7px;
  border:2px solid var(--ink-3);background:transparent;
  display:grid;place-items:center;transition:.12s;
}
.box svg{width:15px;height:15px;stroke:var(--surface);stroke-width:3.2;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.task.done .box{background:var(--verde);border-color:var(--verde)}
.task.done .box svg{opacity:1}
.tbody{flex:1;min-width:0}
.trow{display:flex;gap:8px;align-items:baseline}
.thora{
  flex:none;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;
  color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px;
}
.ttxt{font-size:15px;line-height:1.35;font-weight:500}
.task.done .ttxt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}
.tdet{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.tdet em{color:var(--ink-2);font-style:italic}
.tby{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--verde);margin-top:5px;font-weight:600}
.critflag{
  display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;
  color:var(--rojo);border:1px solid var(--rojo);border-radius:4px;
  padding:0 4px;margin-left:6px;vertical-align:1.5px;
}

/* numeric fields */
.field{display:flex;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line-soft);align-items:center}
.field:last-child{border-bottom:0}
.field .flab{flex:1;font-size:14px;font-weight:500}
.field .flab small{display:block;color:var(--ink-3);font-size:12px;font-weight:400}
.field input{
  flex:none;width:104px;padding:8px 10px;border-radius:8px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;text-align:right;
}
.field input:focus{outline:2px solid var(--amarillo);outline-offset:1px;border-color:var(--amarillo)}
.field input.filled{border-color:var(--verde);background:var(--verde-tint)}

textarea.nota{
  width:100%;min-height:88px;padding:11px 12px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:15px;resize:vertical;
}
textarea.nota:focus{outline:2px solid var(--amarillo);outline-offset:1px}


.traspaso{
  border:1px solid var(--line);border-left:4px solid var(--ambar);
  background:var(--surface);border-radius:var(--radius);padding:13px 15px;margin:14px 0 4px;
}
.tsp-h{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ambar);margin-bottom:7px}
.tsp-n{font-size:14px;color:var(--ink-2);margin-bottom:8px}
.tsp-n b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
.tsp-l{margin:0;padding-left:17px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.tsp-l li{margin-bottom:3px}
.tsp-l li.crit{color:var(--rojo);font-weight:600}
.tsp-l li.mas{list-style:none;margin-left:-17px;color:var(--ink-3);font-size:12.5px;font-style:italic}
.tsp-ok{margin:0;font-size:13.5px;color:var(--verde);font-weight:600}
.tsp-v{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.tsp-nota{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft)}
.tsp-nl{font-family:"Archivo",sans-serif;font-size:10px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px}
.tsp-nota p{margin:0;font-size:14px;color:var(--ink);line-height:1.45;white-space:pre-wrap}

/* ---------- callouts ---------- */
.note{
  border:1px solid var(--line);border-left:4px solid var(--amarillo);
  background:var(--surface);border-radius:8px;padding:12px 14px;margin:14px 0;
  font-size:14px;line-height:1.5;color:var(--ink-2);
}
.note.red{border-left-color:var(--rojo)}
.note b{color:var(--ink);font-weight:700}
.note .nt{
  font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px;
}

/* ---------- footer bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{
  border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
  padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;
  font-family:"Archivo",sans-serif;letter-spacing:-.01em;
}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink);flex:1 1 auto;min-width:0;text-align:center}
.btn.pri:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sync{font-size:11px;color:var(--ink-3);font-weight:600;font-family:"IBM Plex Mono",monospace;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.sync.off{color:var(--rojo)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(26,23,20,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  max-width:480px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.3);
}
.modal .mh{padding:18px 18px 6px}
.modal h3{font-size:19px;font-weight:800}
.modal .mh p{margin:5px 0 0;font-size:13.5px;color:var(--ink-2)}
.modal .mb{padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px}
.pick{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
  padding:12px 13px;cursor:pointer;font-size:15px;font-weight:600;
}
.pick:hover{border-color:var(--ink);}
.pick .rol{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.pick .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.pick .nm b{font-family:"Archivo",sans-serif;font-weight:700;font-size:15px}
.pick .nm small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.nomInput{
  width:100%;padding:12px 13px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:600;
}
.nomInput:focus{outline:2px solid var(--amarillo);outline-offset:1px;border-color:var(--amarillo)}
.tab.mio{border-color:var(--amarillo);box-shadow:inset 0 0 0 1px var(--amarillo)}
.tab.mio[aria-selected="true"]{box-shadow:none}
.pick .av{
  width:28px;height:28px;border-radius:99px;flex:none;display:grid;place-items:center;
  font-family:"Archivo",sans-serif;font-weight:800;font-size:12px;
  background:var(--amarillo);color:#1A1714;
}
.pick.jefe .av{background:var(--rojo);color:#fff}
pre.msg{
  white-space:pre-wrap;word-break:break-word;font-family:"IBM Plex Mono",monospace;
  font-size:12.5px;line-height:1.5;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:12px;margin:0;max-height:44vh;overflow:auto;
}

/* ---------- reglas page ---------- */
.rules{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.rule{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.rule .num{
  flex:none;width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--surface);
  display:grid;place-items:center;font-family:"Archivo",sans-serif;font-weight:800;font-size:13px;
}
.rule h3{font-size:15px;font-weight:700;margin-bottom:2px}
.rule p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.minicard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.minicard h3{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.minicard ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.minicard li{margin-bottom:4px}
.minicard li b{color:var(--ink)}
.footnote{font-size:12.5px;color:var(--ink-3);margin-top:26px;line-height:1.5;border-top:1px solid var(--line);padding-top:14px}


/* ---------- cierre de turno ---------- */
.cierre{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px;box-shadow:var(--shadow);
}
.cierre.ok{border-color:var(--verde);background:var(--verde-tint)}
.cierre.pend{border-color:var(--ambar);background:var(--amarillo-tint)}
.c-res{margin:0 0 12px;font-size:14.5px;color:var(--ink-2);line-height:1.45}
.c-res b{color:var(--ink);font-weight:700;font-family:"IBM Plex Mono",monospace}
.c-botones{display:flex;flex-direction:column;gap:9px}
@media(min-width:520px){.c-botones{flex-direction:row}}
.c-btn{
  flex:1;border:1.5px solid var(--line);border-radius:10px;
  padding:15px 14px;font-family:"Archivo",sans-serif;font-size:16px;font-weight:700;
  cursor:pointer;background:var(--surface-2);letter-spacing:-.01em;min-height:52px;
}
.c-btn.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.c-btn.ok:hover{filter:brightness(1.08)}
.c-btn.pend{background:transparent;border-color:var(--ambar);color:var(--ambar)}
.c-btn.pend:hover{background:var(--amarillo-tint)}
.c-ayuda{margin:11px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.c-sello{display:flex;align-items:center;gap:12px}
.c-ico{
  flex:none;width:38px;height:38px;border-radius:99px;display:grid;place-items:center;
  font-family:"Archivo",sans-serif;font-weight:800;font-size:19px;color:#fff;
}
.cierre.ok .c-ico{background:var(--verde)}
.cierre.pend .c-ico{background:var(--ambar)}
.c-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.c-tx b{font-family:"Archivo",sans-serif;font-size:16px;font-weight:800;letter-spacing:-.01em}
.c-tx small{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);font-weight:600}
.c-det{
  margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--surface);
  border:1px solid var(--line);font-size:14px;line-height:1.45;white-space:pre-wrap;
}
.c-re{margin-top:12px;width:100%;font-size:13px;padding:9px}
.tsp-sello{
  display:inline-block;margin-left:8px;font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:5px;letter-spacing:.02em;
}
.tsp-sello.ok{background:var(--verde-tint);color:var(--verde)}
.tsp-sello.pend{background:var(--amarillo-tint);color:var(--ambar)}
.tsp-sello.abierto{background:var(--rojo-tint);color:var(--rojo)}

/* ---------- celulares chicos ---------- */
@media(max-width:400px){
  .wrap{padding:0 11px 130px}
  .hd{padding:9px 11px 0;gap:8px}
  .tabs{padding:8px 11px}
  .brandtxt h1{font-size:15px}
  .brandtxt .sub{font-size:10.5px}
  .whoami{padding:6px 10px;font-size:12.5px;max-width:120px}
  .whoami #quienTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lhead h2{font-size:23px}
  .task{padding:12px 11px;gap:11px}
  .ttxt{font-size:15px}
  .tdet{font-size:12.5px}
  .field{padding:10px 11px;gap:9px}
  .field input{width:88px;font-size:15px}
  .field .flab{font-size:13.5px}
  .modal .mh{padding:16px 15px 4px}
  .modal .mb{padding:12px 15px 16px}
  .pick{padding:11px}
  .pick .rol{font-size:10px}
  .cierre{padding:13px}
  .c-btn{font-size:15px}
}

*:focus-visible{outline:2px solid var(--amarillo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="hd">
    <div class="brandmark">PF</div>
    <div class="brandtxt">
      <h1>Parte Diario</h1>
      <div class="sub" id="fechaHoy">—</div>
    </div>
    <button class="whoami" id="btnQuien"><span class="dot"></span><span id="quienTxt">Entrar</span></button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>

<div class="wrap" id="app"></div>

<div class="bar">
  <div class="in">
    <span class="sync" id="sync">conectando…</span>
    <button class="btn pri" id="btnWA">Armar traspaso</button>
  </div>
</div>

<script>
/* ============================================================
   PARTE DIARIO — Punilla Full
   Estado compartido en la nube: un documento por día.
   ============================================================ */

const PUESTOS = [
  {id:'enc_m', nombre:'Encargado',   turno:'Turno mañana', horario:'7:55 – 16:05', jefe:true},
  {id:'enc_t', nombre:'Encargado',   turno:'Turno tarde',  horario:'15:55 – 00:05', jefe:true},
  {id:'fiam_m',nombre:'Fiambrería',  turno:'Turno mañana', horario:'7:55 – 16:00'},
  {id:'fiam_t',nombre:'Fiambrería',  turno:'Turno tarde',  horario:'15:55 – 00:00'},

/* ---------- estado ---------- */
/* 🔴 LA FECHA LA PONE EL SERVIDOR. El turno tarde cierra a las 00:05, así que
   sus últimas tildes caen en el día calendario siguiente: la fecha operativa
   corta a las 05:00 de Córdoba. Y el reloj de un teléfono puede estar en
   cualquier lado — si el cliente mandara la fecha, escribiría en otro día. */
let hoy = '';

let ESTADO = {};           /* {listaId:{items:{id:{n,at}}, campos:{id:val}, nota:'', cierre}} */
let listaActiva = 'enc_m', yo = null;

/* Sólo para pintar el nombre antes de que conteste el servidor. La verdad es la
   cookie firmada: si no hay sesión, /api/dia devuelve 401 y se pide el PIN. */
try{ yo = JSON.parse(localStorage.getItem('pf_yo')||'null'); }catch(e){ yo = null; }
if(yo && (!yo.puesto || !PUESTOS.some(p => p.id === yo.puesto))) yo = null;
const miPuesto = () => yo ? PUESTOS.find(p => p.id === yo.puesto) : null;
const soyJefe = () => { const p = miPuesto(); return !!(p && p.jefe); };

function estadoLista(id){
  if(!ESTADO[id]) ESTADO[id] = {items:{},campos:{},nota:''};
  if(!ESTADO[id].items) ESTADO[id].items = {};
  if(!ESTADO[id].campos) ESTADO[id].campos = {};
  return ESTADO[id];
}
const ahora = () => new Date().toLocaleTimeString('es-AR',{timeZone:'America/Argentina/Cordoba',hour:'2-digit',minute:'2-digit',hour12:false});

/* ---------- persistencia ---------- */
function setSync(txt, off){
  const el = document.getElementById('sync');
  el.textContent = txt; el.classList.toggle('off', !!off);
}
function escribiendo(){
  const a = document.activeElement;
  return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
}
let renderDiferido = false;
document.addEventListener('focusout', () => {
  if(renderDiferido){ renderDiferido = false; setTimeout(() => { if(!escribiendo()) render(); }, 60); }
});

async function api(ruta, opts){
  const r = await fetch('/parte/api/' + ruta, Object.assign({
    headers: {'Content-Type':'application/json'},
    credentials: 'same-origin'
  }, opts || {}));
  if(r.status === 401){ yo = null; pintarQuien(); abrirQuien(); throw new Error('sin_sesion'); }
  if(!r.ok) throw new Error('http_' + r.status);
  return r.json();
}

/* 🔴 LA COLA ES LO QUE HACE QUE NO SE PIERDA NADA SIN CONEXIÓN (criterio 6).
   La tilde se aplica en pantalla al toque y el evento queda encolado; cuando
   vuelve la red se manda en orden. Si la tilde esperara a la red, con el wifi
   caído la lista quedaría trabada justo cuando hay que cerrar el turno. */
const COLA = 'pf_cola';
function leerCola(){ try{ return JSON.parse(localStorage.getItem(COLA)||'[]'); }catch(e){ return []; } }
function guardarCola(c){ try{ localStorage.setItem(COLA, JSON.stringify(c)); }catch(e){} }

let mandando = false;
async function drenarCola(){
  if(mandando) return;
  mandando = true;
  try{
    let cola = leerCola();
    while(cola.length){
      const ev = cola[0];
      let est;
      try{
        est = await api('evento', {method:'POST', body: JSON.stringify(ev)});
      }catch(e){
        if(String(e.message) === 'sin_sesion') return;
        /* Falló la red: queda encolado y se reintenta en el próximo poll. */
        setSync('sin conexión · se guarda igual', true);
        return;
      }
      cola = leerCola().slice(1);
      guardarCola(cola);
      /* El servidor devuelve el estado COMPLETO: así aparece también lo que
         cargó el otro teléfono, sin tener que reconstruirlo acá. */
      ESTADO[est.puesto] = {items: est.items, campos: est.campos, nota: est.nota, cierre: est.cierre};
      hoy = est.fecha;
    }
    setSync('al día ✓');
    if(escribiendo()) renderDiferido = true; else render();
  } finally { mandando = false; }
}

/* Aplica el cambio en pantalla YA y encola el evento. El servidor mergea sobre
   lo que hay con SELECT … FOR UPDATE, así que dos teléfonos del mismo puesto no
   se pisan. */
function evento(tipo, itemId, valor, detalle){
  if(!yo){ abrirQuien(); return; }
  const cola = leerCola();
  cola.push({tipo: tipo, itemId: itemId == null ? null : String(itemId), valor: valor, detalle: detalle});
  guardarCola(cola);
  setSync('guardando…');
  drenarCola();
}
const tCampo = {};
/* Mismo debounce de 400 ms que ya tenía para los campos de texto: sin esto se
   mandaría un evento por cada tecla. */
function eventoPronto(tipo, itemId, valor){
  const k = tipo + ':' + itemId;
  clearTimeout(tCampo[k]);
  tCampo[k] = setTimeout(() => evento(tipo, itemId, valor), 400);
}

async function traerDia(){
  try{
    const d = await api('dia');
    hoy = d.fecha;
    yo = {puesto: d.puesto, nombre: d.nombre};
    try{ localStorage.setItem('pf_yo', JSON.stringify(yo)); }catch(e){}
    listaActiva = d.puesto;
    ESTADO[d.puesto] = {items: d.items, campos: d.campos, nota: d.nota, cierre: d.cierre};
    /* El traspaso es SÓLO LECTURA: el de la tarde ve lo que dejó la mañana pero
       no puede escribirlo, o el parte de la mañana dejaría de decir qué hizo. */
    const origen = {enc_t:'enc_m', fiam_t:'fiam_m'}[d.puesto];
    if(origen){ try{ ESTADO[origen] = await api('traspaso'); }catch(e){} }
    document.getElementById('fechaHoy').textContent =
      new Date(hoy + 'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
    pintarQuien();
    setSync(leerCola().length ? 'guardando…' : 'al día ✓');
    if(escribiendo()) renderDiferido = true; else render();
  }catch(e){
    if(String(e.message) !== 'sin_sesion') setSync('sin conexión · se guarda igual', true);
  }
}

async function conectar(){
  await traerDia();
  /* Poll cada 20 s: es lo que hace que aparezca lo que cargó el otro. También
     aprovecha para drenar lo que quedó encolado sin conexión. */
  setInterval(() => { drenarCola(); if(!leerCola().length) traerDia(); }, 20000);
  window.addEventListener('online', drenarCola);
}

/* ---------- render ---------- */
function renderTabs(){
  const c = document.getElementById('tabs');
  c.innerHTML = '';
  const visibles = !yo ? LISTAS
    : LISTAS.filter(L => L.id === yo.puesto || L.reglas);
  visibles.forEach(L => {
    const b = document.createElement('button');
    b.className = 'tab'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', L.id === listaActiva ? 'true' : 'false');
    const p = L.reglas ? null : progreso(L);
    if(yo && L.id === yo.puesto) b.classList.add('mio');
    b.innerHTML = '<span class="t-n"></span><span class="t-h"></span>' +
      (p ? '<span class="t-bar"><i style="width:'+(p.total?Math.round(p.hechas/p.total*100):0)+'%"></i></span>' : '');
    b.querySelector('.t-n').textContent = L.nombre;
    b.querySelector('.t-h').textContent = L.reglas ? 'siempre' : (L.horario + (p.total ? '  ·  ' + p.hechas + '/' + p.total : ''));
    b.onclick = () => { listaActiva = L.id; render(); window.scrollTo(0,0); };
    c.appendChild(b);
  });
}

function progreso(L){
  const st = estadoLista(L.id);
  let total = 0, hechas = 0;
  (L.bloques||[]).forEach(b => b.items.forEach(it => {
    total++;
    if(it.tipo === 'campo'){ if(st.campos[it.id] != null && st.campos[it.id] !== '') hechas++; }
    else if(st.items[it.id]) hechas++;
  }));
  return {total, hechas};
}

function nombreDe(v){ return v && v.n ? v.n : (v || '—'); }

function render(){
  renderTabs();
  const L = LISTAS.find(x => x.id === listaActiva);
  const app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('btnWA').style.display = L.reglas ? 'none' : '';
  if(L.reglas){ renderReglas(app); return; }

  const st = estadoLista(L.id);
  const p = progreso(L);

  const head = document.createElement('div');
  head.className = 'lhead';
  const pillCls = L.turno === 'm' ? 'm' : (L.turno === 't' ? 't' : 'x');
  const pillTxt = L.turno === 'm' ? 'Turno mañana' : (L.turno === 't' ? 'Turno tarde' : 'Los dos turnos');
  head.innerHTML =
    '<div class="who">' +
      '<span class="pill ' + pillCls + '">' + pillTxt + '</span>' +
      '<h2 style="margin-top:7px"></h2>' +
      '<div class="meta"><b class="mono"></b> · <span class="pu"></span></div>' +
    '</div>' +
    '<div class="prog"><span class="track"><i style="width:' + (p.total ? Math.round(p.hechas/p.total*100) : 0) + '%"></i></span><span class="n">' + p.hechas + ' de ' + p.total + '</span></div>';

  head.querySelector('.mono').textContent = L.horario;

  app.appendChild(head);

  if(L.intro){

    n.innerHTML = '<span class="nt">De qué se trata</span>';
    const s = document.createElement('span'); s.textContent = L.intro; n.appendChild(s);
    app.appendChild(n);
  }

  const DE_QUIEN = {enc_t:'enc_m', fiam_t:'fiam_m'};
  if(DE_QUIEN[L.id]) app.appendChild(panelTraspaso(DE_QUIEN[L.id]));

  L.bloques.forEach(bl => {

  ta.value = st.nota || '';
  ta.oninput = () => { st.nota = ta.value; eventoPronto('nota', null, ta.value); };

function bloqueCierre(L, st, p){
  const wrap = document.createElement('div');

  const t = document.createElement('div');
  t.className = 'blockname'; t.textContent = 'Cerrar mi turno';
  wrap.appendChild(t);

  const c = document.createElement('div');
  c.className = 'cierre';
  const falta = p.total - p.hechas;

  if(st.cierre){
    const ok = st.cierre.estado === 'ok';
    c.classList.add(ok ? 'ok' : 'pend');
    const sello = document.createElement('div');
    sello.className = 'c-sello';
    sello.innerHTML = '<span class="c-ico"></span><span class="c-tx"><b></b><small></small></span>';
    sello.querySelector('.c-ico').textContent = ok ? '✓' : '!';
    sello.querySelector('b').textContent = ok ? 'Turno cerrado, todo hecho' : 'Turno cerrado con pendientes';
    sello.querySelector('small').textContent = st.cierre.by + ' · ' + st.cierre.at;
    c.appendChild(sello);
    if(!ok && st.cierre.detalle){
      const dd = document.createElement('p'); dd.className = 'c-det';
      dd.textContent = st.cierre.detalle;
      c.appendChild(dd);
    }
    const re = document.createElement('button');
    re.className = 'btn c-re'; re.textContent = 'Reabrir';
    re.onclick = () => { delete st.cierre; render(); evento('reapertura'); };
    c.appendChild(re);
    wrap.appendChild(c);
    return wrap;
  }

  const res = document.createElement('p');
  res.className = 'c-res';
  res.innerHTML = falta === 0
    ? 'Tildaste <b>las ' + p.total + '</b>. Podés cerrar como terminado.'
    : 'Te quedan <b>' + falta + '</b> sin tildar de ' + p.total + '.';
  c.appendChild(res);

  const row = document.createElement('div');
  row.className = 'c-botones';

  const bOk = document.createElement('button');
  bOk.className = 'c-btn ok'; bOk.textContent = 'Hice todo';
  const cerrarOk = () => {
    st.cierre = {estado:'ok', by: yo.nombre, at: ahora()};
    cerrarModal(); render(); evento('cierre', null, 'ok');
    window.scrollTo(0, document.body.scrollHeight);
  };
  bOk.onclick = () => {
    if(!yo){ abrirQuien(); return; }
    if(falta === 0){ cerrarOk(); return; }
    modal('Te quedan ' + falta + ' sin tildar',
      'Si cerrás como terminado, queda firmado con tu nombre diciendo que hiciste todo.', m => {
      const a = document.createElement('button');
      a.className = 'c-btn ok'; a.textContent = 'Igual cerré todo';
      a.onclick = cerrarOk;
      const b2 = document.createElement('button');
      b2.className = 'btn'; b2.textContent = 'Volver a tildar';
      b2.onclick = cerrarModal;
      m.appendChild(a); m.appendChild(b2);
    });
  };

  const bPe = document.createElement('button');
  bPe.className = 'c-btn pend'; bPe.textContent = 'Quedó pendiente';
  bPe.onclick = () => {
    if(!yo){ abrirQuien(); return; }
    const txt = (st.nota || '').trim();
    if(!txt){
      modal('Falta decir qué quedó', 'El que entra tiene que saber qué hereda. Escribilo y volvé a cerrar.', m => {
        const ta2 = document.createElement('textarea');
        ta2.className = 'nota';
        ta2.placeholder = 'Qué quedó sin hacer y por qué.';
        m.appendChild(ta2);
        const g = document.createElement('button');
        g.className = 'c-btn pend'; g.textContent = 'Guardar y cerrar el turno';
        g.onclick = () => {
          const v = ta2.value.trim();
          if(!v){ ta2.focus(); return; }
          st.nota = v;
          st.cierre = {estado:'pend', by: yo.nombre, at: ahora(), detalle: v};
          cerrarModal(); render();
          /* Dos eventos: la nota y el cierre. Van separados porque son dos
             cosas distintas en el historial, y el tablero los lee aparte. */
          evento('nota', null, v);
          evento('cierre', null, 'pend', v);
          window.scrollTo(0, document.body.scrollHeight);
        };
        m.appendChild(g);
        const c2 = document.createElement('button');
        c2.className = 'btn'; c2.textContent = 'Cancelar';
        c2.onclick = cerrarModal;
        m.appendChild(c2);
        setTimeout(() => ta2.focus(), 60);
      });
      return;
    }
    st.cierre = {estado:'pend', by: yo.nombre, at: ahora(), detalle: txt};
    render(); evento('cierre', null, 'pend', txt);
    window.scrollTo(0, document.body.scrollHeight);
  };

  row.appendChild(bOk); row.appendChild(bPe);
  c.appendChild(row);

  const ay = document.createElement('p');
  ay.className = 'c-ayuda';
  ay.textContent = 'Cerrá tu turno antes de irte. Queda firmado con tu nombre y la hora.';
  c.appendChild(ay);

  wrap.appendChild(c);
  return wrap;
}

function panelTraspaso(origenId){
  const O = LISTAS.find(x => x.id === origenId);
  const st = ESTADO[origenId];
  const d = document.createElement('div');
  d.className = 'traspaso';
  const h = document.createElement('div');
  h.className = 'tsp-h';
  h.textContent = 'Lo que te dejó ' + (origenId === 'enc_m' ? 'el encargado de la mañana' : 'fiambrería de la mañana');
  d.appendChild(h);

  if(!st || (!Object.keys(st.items || {}).length && !Object.keys(st.campos || {}).length && !st.nota)){
    const v = document.createElement('p'); v.className = 'tsp-v';
    v.textContent = 'Todavía no cargaron nada hoy. Si el turno ya terminó, preguntá antes de firmar.';
    d.appendChild(v);
    return d;
  }

  const p = progreso(O);
  const n = document.createElement('div'); n.className = 'tsp-n';
  n.innerHTML = '<b>' + p.hechas + ' de ' + p.total + '</b> hecho';
  if(st.cierre){
    const sp = document.createElement('span');
    sp.className = 'tsp-sello ' + (st.cierre.estado === 'ok' ? 'ok' : 'pend');
    sp.textContent = (st.cierre.estado === 'ok' ? 'Cerró todo' : 'Cerró con pendientes') + ' · ' + st.cierre.by;
    n.appendChild(sp);
  } else {
    const sp = document.createElement('span');
    sp.className = 'tsp-sello abierto';
    sp.textContent = 'Turno sin cerrar';
    n.appendChild(sp);
  }
  d.appendChild(n);

  const faltan = [];
  (O.bloques || []).forEach(b => b.items.forEach(it => {
    if(it.tipo === 'campo'){ if(!st.campos[it.id]) faltan.push({txt: it.lab, crit: false}); }
    else if(!st.items[it.id]) faltan.push({txt: it.txt, crit: it.crit});
  }));
  faltan.sort((a,b) => (b.crit?1:0) - (a.crit?1:0));

  if(faltan.length){
    const ul = document.createElement('ul'); ul.className = 'tsp-l';
    faltan.slice(0,8).forEach(f => {
      const li = document.createElement('li');
      if(f.crit) li.className = 'crit';
      li.textContent = f.txt;
      ul.appendChild(li);
    });
    if(faltan.length > 8){
      const li = document.createElement('li'); li.className = 'mas';
      li.textContent = 'y ' + (faltan.length - 8) + ' más';
      ul.appendChild(li);
    }
    d.appendChild(ul);
  } else {
    const ok = document.createElement('p'); ok.className = 'tsp-ok';
    ok.textContent = 'Sin pendientes.';
    d.appendChild(ok);
  }

  if(st.nota && st.nota.trim()){
    const nt = document.createElement('div'); nt.className = 'tsp-nota';
    const t = document.createElement('span'); t.className = 'tsp-nl'; t.textContent = 'Novedades';
    const b = document.createElement('p'); b.textContent = st.nota.trim();
    nt.appendChild(t); nt.appendChild(b);
    d.appendChild(nt);
  }
  return d;
}

function tareaEl(L, it, st){
  const d = document.createElement('div');
  d.className = 'task' + (it.crit ? ' crit' : '') + (st.items[it.id] ? ' done' : '');
  d.setAttribute('role','button'); d.tabIndex = 0;
  d.innerHTML =
    '<span class="box"><svg viewBox="0 0 24 24"><polyline points="4,12.5 9.5,18 20,6.5"></polyline></svg></span>' +
    '<div class="tbody"><div class="trow"><span class="thora"></span><span class="ttxt"></span></div></div>';
  d.querySelector('.thora').textContent = it.hora;
  const tx = d.querySelector('.ttxt');
  tx.textContent = it.txt;
  if(it.crit){ const f = document.createElement('span'); f.className = 'critflag'; f.textContent = 'CLAVE'; tx.appendChild(f); }
  if(it.det){
    const p = document.createElement('div'); p.className = 'tdet'; p.textContent = it.det;
    d.querySelector('.tbody').appendChild(p);
  }
  const m = st.items[it.id];
  if(m){
    const b = document.createElement('div'); b.className = 'tby';
    b.textContent = '✓ ' + nombreDe(m) + ' · ' + m.at;
    d.querySelector('.tbody').appendChild(b);
  }
  const toggle = () => {
    if(!yo){ abrirQuien(); return; }
    const estaba = !!st.items[it.id];
    if(estaba) delete st.items[it.id];
    else st.items[it.id] = {n: yo.nombre, p: yo.puesto, at: ahora()};
    render();
    /* 🔴 Destildar escribe un evento `destilde`, NO borra el `tilde`: el estado
       dice cómo está la lista, el historial dice qué pasó. */
    evento(estaba ? 'destilde' : 'tilde', it.id);
  };
  d.onclick = toggle;
  d.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
  return d;
}

function campoEl(L, it, st){
  const d = document.createElement('div');
  d.className = 'field';
  d.innerHTML = '<label class="flab"></label>';
  const lab = d.querySelector('.flab');
  lab.textContent = it.lab;
  if(it.sub){ const s = document.createElement('small'); s.textContent = it.sub; lab.appendChild(s); }
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'decimal'; inp.placeholder = it.ph;
  inp.value = st.campos[it.id] || '';
  if(inp.value) inp.classList.add('filled');
  const id = 'f_' + L.id + '_' + it.id;
  inp.id = id; lab.setAttribute('for', id);
  inp.oninput = () => {
    st.campos[it.id] = inp.value;
    inp.classList.toggle('filled', !!inp.value);
    renderTabs(); eventoPronto('campo', it.id, inp.value);
  };
  d.appendChild(inp);
  return d;
}

    ['Frío', ['Refrigerados: <b>0 a 5 °C</b>', 'Congelados: <b>–18 °C o menos</b>', 'Fuera de rango: cartel <b>NO VENDER</b> y llamar a Nico o Jesi', '⚠ Hoy sólo fiambrería toma temperatura, y sólo de su mostrador. <b>Cámara de carne, freezer y exhibidoras no las mira nadie.</b> Pendiente de Nico.']],
    ['Caja y pagos', ['Se cuenta <b>dos veces</b>, siempre', 'Fondo contado <b>antes de la primera venta</b>', 'Toda diferencia se anota, <b>aunque sea de $500</b>', 'Foto del cierre manual y por sistema <b>a Jesi y a Nico</b>', 'Ningún pedido se manda <b>sin que Nico o Jesi lo aprueben</b> en el grupo']]

/* ---------- quién sos ---------- */
function pintarQuien(){
  const b = document.getElementById('btnQuien');
  document.getElementById('quienTxt').textContent = yo ? yo.nombre : 'Entrar';
  b.classList.toggle('set', !!yo);
}
function abrirQuien(){
  const visibles = puestosVisibles();
  const titulo = visibles.length === 1 ? 'Entrar' : '¿Qué turno hacés hoy?';
  const sub = AREA
    ? AREA_NOMBRE[AREA] + ' · elegí tu turno y poné tu PIN.'
    : 'Elegí tu puesto y poné tu PIN.';
  modal(titulo, sub, m => {
    /* Con un solo puesto no se hace elegir de una lista de uno: va derecho al
       PIN. Un paso de más en la caja es un paso que alguien se saltea. */
    if (visibles.length === 1) { setTimeout(() => pedirPin(visibles[0]), 0); return; }
    visibles.forEach(p => {
      const b = document.createElement('button');
      b.className = 'pick' + (p.jefe ? ' jefe' : '');
      b.innerHTML = '<span class="av"></span><span class="nm"><b></b><small></small></span><span class="rol"></span>';
      b.querySelector('.av').textContent = p.nombre.slice(0,1);
      b.querySelector('.nm b').textContent = p.nombre;
      b.querySelector('.nm small').textContent = p.turno;
      b.querySelector('.rol').textContent = p.horario;
      b.onclick = () => pedirPin(p);
      m.appendChild(b);
    });
  });
}

/* 🔴 EL NOMBRE VIENE DEL SERVIDOR, NO LO ESCRIBE LA PERSONA.
   Antes se elegía puesto y se tecleaba un nombre libre: cualquiera podía firmar
   con el nombre de otro, y el parte vale justamente porque dice QUIÉN dijo que
   algo se hizo. Ahora el PIN identifica a la persona DENTRO del puesto, y por
   eso Julián y Vanesa pueden rotar sin que haya que tocar nada.

   El puesto tampoco se manda después: queda en una cookie firmada, así que
   fiambrería mañana no puede escribir en el parte de fiambrería tarde ni
   cambiando el body del request. */
function pedirPin(p){
  modal('Tu PIN', p.nombre + ' · ' + p.turno + ' · ' + p.horario, m => {
    const inp = document.createElement('input');
    inp.className = 'nomInput';
    inp.type = 'password';
    inp.inputMode = 'numeric';
    inp.autocomplete = 'off';
    inp.maxLength = 8;
    inp.placeholder = 'PIN de 4 dígitos';

    const err = document.createElement('p');
    err.className = 'c-det';
    err.style.cssText = 'margin:.4rem 0 0;min-height:1.2em';

    const entrar = async () => {
      const pin = (inp.value || '').trim();
      if(!/^\d{4,8}$/.test(pin)){ err.textContent = 'El PIN son 4 números.'; return; }
      err.textContent = 'Entrando…';
      inp.disabled = true;
      try{
        const r = await fetch('/parte/api/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          credentials: 'same-origin',
          body: JSON.stringify({puesto: p.id, pin: pin})
        });
        if(r.status === 429){
          /* Cinco intentos por IP y puesto cada 15 minutos: 4 dígitos son
             10.000 combinaciones y en los campos hay montos de caja. */
          err.textContent = 'Demasiados intentos. Esperá 15 minutos.';
          inp.disabled = false; return;
        }
        if(!r.ok){ err.textContent = 'PIN incorrecto.'; inp.disabled = false; inp.value = ''; inp.focus(); return; }
        const d = await r.json();
        yo = {puesto: d.puesto, nombre: d.nombre};
        try{ localStorage.setItem('pf_yo', JSON.stringify(yo)); }catch(e){}
        listaActiva = d.puesto;
        pintarQuien(); cerrarModal();
        await traerDia();
        window.scrollTo(0,0);
      }catch(e){
        err.textContent = 'Sin conexión. Probá de nuevo.';
        inp.disabled = false;
      }
    };

    inp.onkeydown = e => { if(e.key === 'Enter') entrar(); };
    m.appendChild(inp);
    m.appendChild(err);

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;margin-top:.6rem';
    const ok = document.createElement('button');
    ok.className = 'btn pri'; ok.textContent = 'Entrar'; ok.onclick = entrar;
    const volver = document.createElement('button');
    volver.className = 'btn'; volver.textContent = 'Volver'; volver.onclick = abrirQuien;
    row.appendChild(ok); row.appendChild(volver);
    m.appendChild(row);
    setTimeout(() => inp.focus(), 60);
  });
}

/* Salir cierra la sesión del servidor: si sólo se borrara el localStorage, la
   cookie seguiría viva y el siguiente que agarre el teléfono escribiría con el
   nombre del anterior. */
async function salir(){
  try{ await fetch('/parte/api/logout', {method:'POST', credentials:'same-origin'}); }catch(e){}
  try{ localStorage.removeItem('pf_yo'); }catch(e){}
  yo = null; ESTADO = {};
  pintarQuien(); render(); abrirQuien();
}

document.getElementById('btnWA').onclick = () => {
  const txt = textoTraspaso();
  modal('Mensaje de traspaso', 'Copialo y pegalo en el grupo. Lo manda el que entra, no el que se va.', m => {
    const pre = document.createElement('pre'); pre.className = 'msg'; pre.textContent = txt;
    m.appendChild(pre);
    const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:8px';
    const cop = document.createElement('button'); cop.className = 'btn pri'; cop.textContent = 'Copiar';
    cop.onclick = async () => {
      try{ await navigator.clipboard.writeText(txt); cop.textContent = 'Copiado ✓'; }
      catch(e){
        const r = document.createRange(); r.selectNodeContents(pre);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        cop.textContent = 'Seleccionado — copialo';
      }
    };
    const cer = document.createElement('button'); cer.className = 'btn'; cer.textContent = 'Cerrar';
    cer.onclick = cerrarModal;
    row.appendChild(cop); row.appendChild(cer); m.appendChild(row);
  });
};

/* ---------- arranque ---------- */
document.getElementById('btnQuien').onclick = () => { if(yo) salir(); else abrirQuien(); };
/* La fecha la escribe traerDia() con la que manda el servidor: la operativa
   corta a las 05:00, y con el reloj del cliente el turno tarde vería el día
   siguiente. */
(function(){
  if(yo){ listaActiva = yo.puesto; return; }
  const h = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Argentina/Cordoba'})).getHours();
  listaActiva = (h >= 7 && h < 16) ? 'enc_m' : 'enc_t';
})();

pintarQuien();
render();
if(!yo) setTimeout(abrirQuien, 200);
setSync('conectando…');
conectar();
</script>
